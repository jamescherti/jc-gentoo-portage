# When a dynamically linked program like calls an external function in a shared
# library, the compiler does not know the memory address of that function at
# compile time because shared libraries are loaded at random addresses (ASLR) at
# runtime.
#
# By default, GCC generates a PLT (Procedure Linkage Table) stub inside the
# binary, paired with a GOT (Global Offset Table) pointer in memory:
# 1. First call: The program executes call malloc@plt. The PLT stub jumps to an
# address stored in the GOT. On the first run, that GOT entry points back to the
# dynamic linker (ld-linux.so), which looks up the symbol malloc, patches the
# GOT entry with the real address, and jumps to it.
#
# 2. Every subsequent call: tmux executes call malloc@plt (Jump 1: into the PLT
# section of the binary). The PLT executes jmp *malloc@GOTPCREL(%rip) (Jump 2:
# dereferences the GOT pointer and jumps to the actual libjemalloc function).
#
# Every single call to an external shared library function requires two jumps (a
# direct call to the PLT, followed by an indirect jmp through the GOT), and
# wastes instruction cache (L1i) space holding the PLT trampolines.
CFLAGS="${CFLAGS} -fno-plt"
CXXFLAGS="${CXXFLAGS} -fno-plt"
