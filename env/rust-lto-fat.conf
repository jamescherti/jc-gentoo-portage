# lto=fat allows the LLVM compiler backend to analyze, optimize, and
# inline code across all crate boundaries (dependencies) during the linking
# phase. For a tool like ripgrep, which relies on external crates like the regex
# engine, cross-crate optimization provides a measurable runtime speedup. The
# trade-off is longer compile times and higher RAM usage during the build.
CARGO_PROFILE_RELEASE_LTO="fat"
